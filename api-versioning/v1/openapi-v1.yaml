openapi: 3.1.0
info:
  title: AstraMindAI API (v1)
  version: 1.0.0
  description: Legacy API version for backward compatibility.

paths:
  /v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /v1/chat:
    post:
      summary: Basic chat endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Chat response
