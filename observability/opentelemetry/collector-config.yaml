receivers:
  otlp:
    protocols:
      http:
      grpc:

exporters:
  logging:
    loglevel: info
  otlp:
    endpoint: "http://otel-collector:4317"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging, otlp]
    metrics:
      receivers: [otlp]
      exporters: [logging, otlp]
