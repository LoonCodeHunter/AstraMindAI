apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: astramind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: astramind/backend:staging
          ports:
            - containerPort: 4000
