apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: astramind
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: astramind/frontend:prod
          ports:
            - containerPort: 3000
