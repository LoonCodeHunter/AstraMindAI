apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astramind-dev-ingress
  namespace: astramind
spec:
  rules:
    - host: "dev.astramind.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
