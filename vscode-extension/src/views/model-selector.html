<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Model Selector</title>
  <link rel="stylesheet" href="../assets/styles/model-selector.css" />
</head>

<body>
  <h2>Select Model</h2>
  <ul id="models"></ul>

  <script>
    const vscode = acquireVsCodeApi();
    const list = document.getElementById("models");

    function render(models, current) {
      list.innerHTML = "";
      models.forEach((m) => {
        const li = document.createElement("li");
        li.className = "model-option";
        if (m === current) li.classList.add("model-option-active");
        li.textContent = m;
        li.onclick = () => vscode.postMessage({ type: "switchModel", model: m });
        list.appendChild(li);
      });
    }

    window.addEventListener("message", (event) => {
      if (event.data.type === "models") {
        render(event.data.models, event.data.current);
      }
    });

    vscode.postMessage({ type: "requestModels" });
  </script>
</body>
</html>
