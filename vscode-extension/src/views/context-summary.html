<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Context Summary</title>
  <link rel="stylesheet" href="../assets/styles/context-summary.css" />
</head>

<body>
  <h2>Workspace Context Summary</h2>
  <div id="summary" class="summary">Loading...</div>

  <script>
    const vscode = acquireVsCodeApi();
    const summaryEl = document.getElementById("summary");

    function updateSummary(data) {
      summaryEl.innerHTML = `
        <strong>File:</strong> ${data.fileName}<br>
        <strong>Language:</strong> ${data.language}<br>
        <strong>Selected Text:</strong> ${data.selection || "(none)"}
      `;
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg.type === "context") updateSummary(msg);
    });

    vscode.postMessage({ type: "requestContext" });
  </script>
</body>
</html>
