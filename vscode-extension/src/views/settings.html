<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="../assets/styles/settings.css" />
</head>

<body>
  <h2>AstraMind Settings</h2>

  <div class="settings">
    <label>
      <input type="checkbox" id="telemetry" />
      Enable telemetry
    </label>

    <label>
      <input type="checkbox" id="contextSync" />
      Enable context sync
    </label>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    const tele = document.getElementById("telemetry");
    const ctx = document.getElementById("contextSync");

    tele.onchange = () =>
      vscode.postMessage({ type: "settings", key: "telemetry", value: tele.checked });

    ctx.onchange = () =>
      vscode.postMessage({ type: "settings", key: "contextSync", value: ctx.checked });

    window.addEventListener("message", (event) => {
      if (event.data.type === "settings") {
        tele.checked = event.data.telemetry;
        ctx.checked = event.data.contextSync;
      }
    });

    vscode.postMessage({ type: "requestSettings" });
  </script>
</body>
</html>
