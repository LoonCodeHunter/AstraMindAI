name: VSCode Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Compile extension
        run: pnpm run build

      - name: Run extension tests
        run: pnpm test
