apiVersion: v1
kind: Namespace
metadata:
  name: astramind-ml-service
  labels:
    astramind.ai/tenant: ml
---
apiVersion: v1
kind: Namespace
metadata:
  name: astramind-backend
  labels:
    astramind.ai/tenant: api
---
apiVersion: v1
kind: Namespace
metadata:
  name: astramind-frontend
  labels:
    astramind.ai/tenant: ui
---
apiVersion: v1
kind: Namespace
metadata:
  name: astramind-worker
  labels:
    astramind.ai/tenant: jobs
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: astramind-ml-quota
  namespace: astramind-ml-service
spec:
  hard:
    requests.cpu: "64"
    requests.memory: "256Gi"
    limits.cpu: "128"
    limits.memory: "512Gi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-service-ingress
  namespace: astramind-ml-service
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              astramind.ai/tenant: api
      ports:
        - protocol: TCP
          port: 8080
