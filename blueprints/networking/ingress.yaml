apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astramind-ingress
  namespace: astramind-backend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
    - hosts:
        - api.astramind.ai
      secretName: astramind-tls
  rules:
    - host: api.astramind.ai
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: astramind-backend-v1
                port:
                  number: 8080
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: astramind-backend-v2
                port:
                  number: 8080
