[project]
name = "astramindai-ml-service"
version = "0.1.0"
description = "ML microservice for AstraMindAI"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "numpy",
  "scikit-learn",
  "torch",
  "transformers"
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
